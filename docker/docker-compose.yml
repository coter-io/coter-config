services:
  openclaw-gateway:
    image: ghcr.io/${GHCR_USERNAME:?required, your GHCR namespace in lowercase}/openclaw-docker-config/openclaw-gateway:latest
    # Deliberately no `env_file:`. It copied every key of the operator's .env
    # into the container, including OPENCLAW_CONFIG_DIR and OPENCLAW_WORKSPACE_DIR
    # — which name the *host* side of the bind mounts below and hold VPS paths.
    # The gateway honoured them as its own writable directories, so every state
    # write resolved to /home/openclaw/... inside the container, where /home is
    # root-owned and the process is uid 1000: "EACCES: permission denied, mkdir
    # '/home/openclaw'", and every inbound message dead-lettered without a reply.
    # The `environment:` block below names everything the container needs, and
    # the two OPENCLAW_*_DIR pins there state the in-container targets outright.
    # ${VAR} interpolation is a separate mechanism that still reads .env, so the
    # image reference and the bind-mount sources are unaffected by this absence.
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      BRAVE_API_KEY: ${BRAVE_API_KEY-}
      GH_TOKEN: ${GH_TOKEN:-}
      HOME: /home/node
      NODE_ENV: production
      # Marked :? so an unset value stops the stack with a named error. Plain
      # ${VAR} substitutes a blank string and boots half-broken instead.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?required, generate with openssl rand -hex 32}
      # Pins, not pass-throughs: hardcoded in-container paths, never ${VAR}.
      # OPENCLAW_CONFIG_DIR and OPENCLAW_WORKSPACE_DIR name the *host* bind-mount
      # sources under `volumes:` below, where they hold VPS paths. The gateway
      # reads the same two names as its own writable directories, so these must
      # stay equal to the `volumes:` targets declared in this service — change a
      # target, change these. Redundant now that `env_file:` is gone (see the
      # comment above `restart:`) and kept deliberately: the removal and these
      # pins are two halves of one fix, so do not delete either half alone.
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?required for all models, audio transcription included, set it in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required, create a bot with BotFather}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:?required for the DM allowlist, get it from userinfobot}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:?required by mcp.servers.composio in openclaw.json}
      COMPOSIO_MCP_URL: ${COMPOSIO_MCP_URL:?required, the gateway rejects its config without a valid URL}
      TERM: xterm-256color
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/home/openclaw/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/home/openclaw/.openclaw/workspace}:/home/node/.openclaw/workspace
    ports:
      - "127.0.0.1:18789:18789"
    command: openclaw gateway --bind lan --port 18789

  workspace-sync:
    image: ghcr.io/${GHCR_USERNAME:?required, your GHCR namespace in lowercase}/openclaw-docker-config/workspace-sync:latest
    restart: unless-stopped
    environment:
      GIT_WORKSPACE_REPO: ${GIT_WORKSPACE_REPO:-}
      GIT_WORKSPACE_REMOTE: ${GIT_WORKSPACE_REMOTE:-}
      GIT_WORKSPACE_BRANCH: ${GIT_WORKSPACE_BRANCH:-auto}
      GIT_WORKSPACE_TOKEN: ${GIT_WORKSPACE_TOKEN:-}
      GIT_WORKSPACE_SYNC_SCHEDULE: ${GIT_WORKSPACE_SYNC_SCHEDULE:-0 4 * * *}
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-/home/openclaw/.openclaw/workspace}:/workspace
    profiles:
      - sync

  # For multi-agent setups, duplicate the workspace-sync service for each agent.
  # The volume subdirectory must match the agent's workspace path in openclaw.json
  # (e.g. "workspace": "~/.openclaw/workspace/second" → mount /second).
  #
  # workspace-sync-second:
  #   image: ghcr.io/${GHCR_USERNAME}/openclaw-docker-config/workspace-sync:latest
  #   restart: unless-stopped
  #   environment:
  #     GIT_WORKSPACE_REPO: ${GIT_WORKSPACE_REPO_SECOND:-}
  #     GIT_WORKSPACE_REMOTE: ${GIT_WORKSPACE_REMOTE_SECOND:-}
  #     GIT_WORKSPACE_BRANCH: ${GIT_WORKSPACE_BRANCH:-auto}
  #     GIT_WORKSPACE_TOKEN: ${GIT_WORKSPACE_TOKEN:-}
  #     GIT_WORKSPACE_SYNC_SCHEDULE: ${GIT_WORKSPACE_SYNC_SCHEDULE:-0 4 * * *}
  #   volumes:
  #     - ${OPENCLAW_WORKSPACE_DIR:-/home/openclaw/.openclaw/workspace}/second:/workspace
  #   profiles:
  #     - sync
