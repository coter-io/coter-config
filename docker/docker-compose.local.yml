# Local development overrides. Never deployed.
#
# Applied only by ./local.sh, which passes it as a second -f after
# docker-compose.yml. It is deliberately NOT named docker-compose.override.yml:
# Compose auto-loads that name, and the infra repo's `make bootstrap` copies a
# file out of this directory to the VPS. A deployment must never pick these up.
#
# Everything here is a delta. The service definitions — ports, command, the
# environment block, the volume targets — are inherited from docker-compose.yml
# so a local run exercises the shipped file rather than a parallel copy of it.
#
# IMPORTANT: every relative path below resolves against the *project directory*,
# not against this file's directory. local.sh passes --project-directory . (the
# repo root), so `.` here means the repo root and `..` would mean the directory
# above the repo. This applies to build.context, bind-mount sources and
# env_file alike. Verified against the renderer, not assumed.
#
# Variables used only here (OPENCLAW_LOCAL_STATE_DIR) are outside the
# deployment-env-contract and are not declared in docker/.env.example. See the
# header comment in scripts/check-env-vars.sh.

services:
  openclaw-gateway:
    # Build the shipped Dockerfile from the repo root instead of pulling from
    # GHCR. No platform is pinned, so the image is built for the developer's
    # architecture; scripts/build-and-push.sh remains the only producer of the
    # linux/amd64 artifact the VPS runs. This image is not deployable.
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Replaces the inherited GHCR reference with a local tag, so `up` can never
    # pull or push. Note this does NOT remove the ${GHCR_USERNAME:?...} guard in
    # docker-compose.yml: Compose interpolates each file as it loads it, before
    # merging, so that variable must still have a value. local.sh supplies a
    # placeholder when .env does not set one.
    image: coter-openclaw-gateway:local
    # No env_file override is needed, and adding one is a trap. Compose resolves
    # a relative env_file against the *project directory*, not the compose
    # file's directory, and local.sh passes --project-directory . (the repo
    # root) — so the inherited `env_file: .env` already resolves to the
    # project-root .env. An `../.env` here resolves one level above the repo.
    # This is separate from --env-file on the command line, which only controls
    # which file ${VAR} interpolation reads; both must point at the same file,
    # and local.sh makes them.
    # The inherited defaults are VPS paths (/home/openclaw/...). Docker Desktop
    # on macOS shares /Users, /Volumes, /private and /tmp only, so those cannot
    # be bind-mounted from a developer machine. Both mounts stay nested exactly
    # as docker-compose.yml declares them; Docker orders mounts by path depth.
    volumes:
      - ${OPENCLAW_LOCAL_STATE_DIR:-./.local}/openclaw:/home/node/.openclaw
      - ${OPENCLAW_LOCAL_STATE_DIR:-./.local}/workspace:/home/node/.openclaw/workspace
    environment:
      # The shipped config binds the gateway to lan for the VPS; locally the
      # published port is already loopback-only, so this changes nothing about
      # reachability. Kept explicit so a local run is obviously local.
      NODE_ENV: development
      # OPENCLAW_CONFIG_DIR and OPENCLAW_WORKSPACE_DIR name the *host* bind-mount
      # sources in docker-compose.yml, and docker/.env.example declares both with
      # VPS values. Because docker-compose.yml also carries `env_file: .env`,
      # every key of the root .env is injected into the container — so those two
      # host paths arrive in the container's own environment, where the gateway
      # honours them as its writable state directory. /home is root-owned and the
      # process is uid 1000 (node), so every state write failed with
      # "EACCES: permission denied, mkdir '/home/openclaw'" and every inbound
      # message dead-lettered without a reply. Measured, not assumed.
      #
      # An `environment:` entry wins over `env_file`, so pinning the in-container
      # targets here neutralises whatever the root .env sets. These must stay
      # equal to the mount targets declared above.
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
