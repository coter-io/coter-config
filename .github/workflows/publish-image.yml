name: Publish image

on:
  workflow_dispatch:
    inputs:
      latest:
        description: Also tag and push :latest
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "Selected ref '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}, not a tag." >&2
          echo "Use 'Use workflow from' and pick a tag." >&2
          exit 1

      - name: Require a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! out=$(gh release view "${GITHUB_REF_NAME}" 2>&1); then
            echo "No published GitHub release found for tag '${GITHUB_REF_NAME}'." >&2
            echo "Create a release for this tag in the GitHub UI, then re-run." >&2
            echo "gh output: ${out}" >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Validate config
        run: bash scripts/validate-config.sh

      - name: Scan for secrets
        run: bash scripts/check-secrets.sh

      # Same contract the pull request gate enforces, so a tag cannot publish
      # with an undocumented or misnamed environment variable.
      - name: Check environment variable contract
        run: bash scripts/check-env-vars.sh

      - name: Compute image coordinates
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          WITH_LATEST: ${{ inputs.latest }}
        run: |
          owner="${OWNER,,}"
          prefix="ghcr.io/${owner}/openclaw-docker-config"
          sha="${GITHUB_SHA::7}"

          tags_for() {
            local image="$1"
            echo "${prefix}/${image}:${TAG}"
            echo "${prefix}/${image}:${sha}"
            if [ "$WITH_LATEST" = "true" ]; then
              echo "${prefix}/${image}:latest"
            fi
          }

          {
            echo "gateway_tags<<EOF"
            tags_for openclaw-gateway
            echo "EOF"
            echo "sync_tags<<EOF"
            tags_for workspace-sync
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.gateway_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push workspace-sync image
        uses: docker/build-push-action@v6
        with:
          context: docker/workspace-sync
          file: docker/workspace-sync/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.sync_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
